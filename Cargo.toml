[package]
name = "axis-gui"
version = "6.0.0"
edition = "2021"
rust-version = "1.75"
description = "AXIS · Plataforma de Red Team e Blue Team para Windows — GUI local para avaliação, emulação de adversário e defesa ativa"
authors = ["Del"]
license = "MIT"
repository = "https://github.com/delaccont-sketch/axis-core"
homepage = "https://github.com/delaccont-sketch/axis-core"
documentation = "https://github.com/delaccont-sketch/axis/blob/main/README.md"
readme = "README.md"
keywords = ["security", "red-team", "blue-team", "pentest", "windows"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
